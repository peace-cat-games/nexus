[project]
name = "nexus"
version = "0.1.0"
description = "Nexus game implementation"
requires-python = ">=3.10"

[project.scripts]
nexus = "nexus.cli:main"

[tool.setuptools]
packages = ["nexus", "nexus.tests"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=24.0",
]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["nexus/tests"]
